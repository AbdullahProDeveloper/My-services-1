<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Services</title>
    <!-- External CSS linking -->
    <link rel="stylesheet" href="styles.css">
 
    <!-- Google Fonts Linking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
          

<body>
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I am a web developer. This is my first website created using HTML.</p>
        <img src="image/Abdullah-2.jpg" alt="Placeholder Image">
    </section>

    <section id="services">
        <h2>My Services</h2>
        <ol>
            <li><a href="scripts/html file.html" onclick="openTab('HTML Tags')">HTML TAGS</a></li>
            <li><a href="#" onclick="openTab('CSS')">CSS</a></li>
            <li><a href="#" onclick="openTab('Java')">Java</a></li>
        </ol>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 My First Website. All rights reserved.</p>
    </footer>

    <script>
        function openTab(service) {
            const url = `data:text/html,<h1>${service}</h1>
            <p>This is some content for ${service}</p>`;
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
